# ─────────────────────────────────────────────────────────────────────────────
# Cargo workspace virtual del monorepo TPV.
# Miembros: las crates hexagonales en crates/* y la app Tauri en apps/tpv-main/src-tauri.
# Las versiones de dependencias compartidas se centralizan en [workspace.dependencies]
# para que cada crate use `dep = { workspace = true }`.
# ─────────────────────────────────────────────────────────────────────────────
[workspace]
resolver = "2"
members = [
  "crates/tpv-domain",
  "crates/tpv-application",
  "crates/tpv-infra-sqlite",
  "crates/tpv-infra-licensing",
  "crates/tpv-infra-http",
  "crates/tpv-contracts",
  "crates/tpv-telemetry",
  "apps/tpv-main/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Altaria Lights"]

[workspace.dependencies]
# ── Crates internas (rutas relativas a la raíz del workspace) ──
tpv-domain = { path = "crates/tpv-domain" }
tpv-application = { path = "crates/tpv-application" }
tpv-infra-sqlite = { path = "crates/tpv-infra-sqlite" }
tpv-infra-licensing = { path = "crates/tpv-infra-licensing" }
tpv-infra-http = { path = "crates/tpv-infra-http" }
tpv-contracts = { path = "crates/tpv-contracts" }
tpv-telemetry = { path = "crates/tpv-telemetry" }

# ── Async / Runtime ──
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# ── Serde / JSON ──
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Fechas ──
chrono = { version = "0.4", features = ["serde"] }

# ── DB ──
# Sólo `core`: leemos un fichero SQLite local. Las features por defecto arrastran replication,
# remote, hrana y tls (tonic, hyper, tower…) para hablar con un servidor Turso, que en la Main no
# se usa nunca — el que habla con la nube es el worker.
libsql = { version = "0.9.30", default-features = false, features = ["core"] }

# ── HTTP ──
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# ── Imágenes (redimensionado + recompresión a JPEG antes de subir a R2) ──
# Sin default-features para no arrastrar todos los formatos: sólo decodificar lo que mandan
# los móviles/desktop (jpeg/png/webp) y codificar JPEG optimizado.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

# ── Errores ──
thiserror = "1"
anyhow = "1"

# ── Utils / Cripto / Auth ──
regex = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "v7"] }
pbkdf2 = "0.12"
password-hash = "0.5"
rand = "0.8"
keyring = "2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
# Cifrado de campo de la PII del personal (TRAB-03, ver ports/field_cipher.rs).
aes-gcm = "0.10"
hmac = "0.12"

# ── Generación de tipos TS (ts-rs) ──
# serde-compat va activo por defecto; chrono-impl añade soporte para tipos chrono.
ts-rs = { version = "12", features = ["chrono-impl"] }

# ── Codigo QR del ticket (FISCAL-01, arts. 20-21 de la Orden HAC/1177/2024) ──
# Sin default-features: solo hace falta la MATRIZ de modulos, no renderizar a imagen. La
# rasterizacion a ESC/POS la hace printing.rs por el mismo camino que el logo (GS v 0), que es
# mas portable que el `GS ( k` nativo de QR: no todas las termicas lo llevan.
qrcode = { version = "0.14", default-features = false }

# ── Migraciones: embeber los .sql de packages/database/migrations en el binario ──
include_dir = "0.7"

# ── Observabilidad / Logging (crate tpv-telemetry) ──
# `tracing` es la FACHADA que emite el resto de crates (sin conocer el destino). Los sinks
# (consola/fichero/nube) los monta tpv-telemetry como capas del subscriber.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Fichero local rotado por días con tope de número de ficheros (max_log_files).
tracing-appender = "0.2"
# Sentry (errores/crashes): el cliente lo construye tpv-telemetry; el plugin de Tauri
# (tauri-plugin-sentry, sólo en la app) reutiliza ese mismo cliente para unificar Rust+Webview.
# Transporte por **rustls** (no native-tls) para no arrastrar openssl-sys: native-tls no
# cross-compila a Android (allí usaría openssl) y el resto del proyecto ya va con rustls.
sentry = { version = "0.42", default-features = false, features = ["backtrace", "contexts", "debug-images", "panic", "reqwest", "rustls"] }
# Puente tracing→Sentry: convierte los `error!` en eventos Sentry con breadcrumbs.
sentry-tracing = "0.42"
