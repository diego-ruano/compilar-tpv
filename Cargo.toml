# ─────────────────────────────────────────────────────────────────────────────
# Cargo workspace virtual del monorepo TPV.
# Miembros: las crates hexagonales en crates/* y la app Tauri en apps/tpv-main/src-tauri.
# Las versiones de dependencias compartidas se centralizan en [workspace.dependencies]
# para que cada crate use `dep = { workspace = true }`.
# ─────────────────────────────────────────────────────────────────────────────
[workspace]
resolver = "2"
members = [
  "crates/tpv-domain",
  "crates/tpv-application",
  "crates/tpv-infra-sqlite",
  "crates/tpv-infra-licensing",
  "crates/tpv-infra-http",
  "crates/tpv-contracts",
  "crates/tpv-telemetry",
  "apps/tpv-main/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Altaria Lights"]

[workspace.dependencies]
subtle = "2.6"
# ── Crates internas (rutas relativas a la raíz del workspace) ──
tpv-domain = { path = "crates/tpv-domain" }
tpv-application = { path = "crates/tpv-application" }
tpv-infra-sqlite = { path = "crates/tpv-infra-sqlite" }
tpv-infra-licensing = { path = "crates/tpv-infra-licensing" }
tpv-infra-http = { path = "crates/tpv-infra-http" }
tpv-contracts = { path = "crates/tpv-contracts" }
tpv-telemetry = { path = "crates/tpv-telemetry" }

# ── Async / Runtime ──
# Cada crate declara las features que necesita; los tests las amplían en dev-dependencies.
tokio = "1"
async-trait = "0.1"

# ── Serde / JSON ──
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: un número que llega en JSON se lee como el doble exacto que se escribió. Sin
# él, serde lee algunos decimales largos con un bit de menos, y el contraste con la nube (que suma el
# hash de cada fila) daría por distinta una fila igual; la recuperación restauraría ese bit de menos.
serde_json = { version = "1", features = ["float_roundtrip"] }

# ── Fechas ──
chrono = { version = "0.4", features = ["serde"] }

# ── DB ──
# SQLite local de la Main. `bundled` compila el SQLite que trae la crate: el mismo en Windows,
# Windows 7 y Android, sin depender del que tenga el sistema. Con la nube no habla: eso es cosa del
# worker. `limits` (AUD-02) da `set_limit`, con el que el escritor deja de admitir `ATTACH`: es una
# llamada a `sqlite3_limit` del propio SQLite empaquetado, sin dependencias ni código por plataforma.
rusqlite = { version = "0.40.2", features = ["bundled", "limits"] }

# ── HTTP ──
# `gzip`: el cliente pide las respuestas comprimidas (`Accept-Encoding: gzip`) y las descomprime al
# leerlas. Un volcado de la base del negocio es JSON muy repetitivo y viaja en una fracción.
reqwest = { version = "0.12", default-features = false, features = ["gzip", "json", "rustls-tls"] }

# ── Imágenes (redimensionado + recompresión a JPEG antes de subir a R2) ──
# Sin default-features para no arrastrar todos los formatos: sólo JPEG y PNG, que son los que
# admite `imagenes::decodificar`. WebP no: su decodificador reserva lo que declara el fichero
# antes de comprobarlo e `image` no le pasa ningún límite (AUD-30).
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# ── Errores ──
thiserror = "2"
strum = { version = "0.28", features = ["derive"] }

# ── Utils / Cripto / Auth ──
regex = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "v7"] }
pbkdf2 = "0.12"
rand = "0.10"
# Feature por defecto `v1`: el almacén nativo de cada escritorio (en Windows, el Administrador de
# credenciales). Sin ella la 4 no compila, así que no puede caer en silencio en un almacén en memoria,
# como hacía la 3 sin features. El formato de la credencial lo vigila un test de `secret_store.rs`.
keyring = "4.2"
ed25519-dalek = "3"
sha2 = "0.10"
# Cifrado de campo de la PII del personal (TRAB-03, ver ports/field_cipher.rs).
aes-gcm = "0.10"
hmac = "0.12"

# ── Copias locales comprimidas (gzip) ──
# Con el backend en Rust puro (miniz_oxide), sin compilar C. Un `.db.gz` lo abre 7-Zip, así que un
# técnico puede sacar la base sin nuestro código.
flate2 = "1"

# ── Migraciones: embeber los .sql de packages/database/migrations en el binario ──
include_dir = "0.7"

# ── Observabilidad / Logging (crate tpv-telemetry) ──
# `tracing` es la FACHADA que emite el resto de crates (sin conocer el destino). Los sinks
# (consola/fichero/nube) los monta tpv-telemetry como capas del subscriber.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Fichero local rotado por días con tope de número de ficheros (max_log_files).
tracing-appender = "0.2"
# Sentry (errores/crashes): el cliente lo construye tpv-telemetry; el plugin de Tauri
# (tauri-plugin-sentry, sólo en la app) reutiliza ese mismo cliente para unificar Rust+Webview.
# Transporte por **rustls** (no native-tls) para no arrastrar openssl-sys: native-tls no
# cross-compila a Android (allí usaría openssl) y el resto del proyecto ya va con rustls.
sentry = { version = "0.42", default-features = false, features = ["backtrace", "contexts", "debug-images", "panic", "reqwest", "rustls"] }
# Puente tracing→Sentry: convierte los `error!` en eventos Sentry con breadcrumbs.
sentry-tracing = "0.42"

specta = { version = "=2.0.0-rc.25", features = ["derive", "function", "chrono", "serde_json", "uuid"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
