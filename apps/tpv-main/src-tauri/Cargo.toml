[package]
name = "tpv"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tpv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ───────────── Tauri ─────────────
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2.6"

# ───────────── Async / Runtime ─────────────
tokio = { version = "1", features = ["full"] }
async-trait = { workspace = true }

# ───────────── DB ─────────────
libsql = { workspace = true }

# ───────────── Serde ─────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ───────────── Chrono ─────────────
chrono = { version = "0.4", features = ["serde"] }

# ───────────── Utils ─────────────
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

# ───────────── Imágenes (resize + recompresión JPEG antes de subir a R2) ─────────────
image = { workspace = true }

# ───────────── Código QR del ticket (FISCAL-01) ─────────────
qrcode = { workspace = true }

# ───────────── Seguridad / Auth ─────────────
pbkdf2 = "0.12"
password-hash = "0.5"
rand = "0.8"

# ✅ NUEVO (anti-copia: keychain + firma ed25519 + hash)
keyring = "2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"

# ───────────── HTTP ─────────────
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# ───────────── Crates internas (arquitectura hexagonal) ─────────────
tpv-domain = { workspace = true }
tpv-application = { workspace = true }
tpv-infra-sqlite = { workspace = true }
tpv-infra-licensing = { workspace = true }
tpv-infra-aeat = { workspace = true }
tpv-infra-http = { workspace = true }
tpv-contracts = { workspace = true }
tpv-telemetry = { workspace = true }

# ───────────── Observabilidad / Logging ─────────────
# Fachada de logging: el shell y los comandos emiten con las macros de `tracing`; el destino
# (consola/fichero/nube) lo monta `tpv-telemetry` al arrancar.
tracing = { workspace = true }
# Fachada `log` (además de `tracing`): en Android la enruta `android_logger` a logcat (ver run()).
log = "0.4"
# ───────────── Solo escritorio (no cross-compilan / no aplican a móvil) ─────────────
# Estos plugins no cross-compilan a móvil; en Android se sustituyen por su equivalente de plataforma.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Auto-actualización (descarga + verifica firma del instalador desde el feed de tpv-api).
# En Android las actualizaciones van por Google Play.
tauri-plugin-updater = "2"
# Plugin de Sentry (bridge webview+core + minidump de crashes nativos). Arrastra
# `sentry-rust-minidump` (proceso helper) y native-tls → openssl, que no cross-compilan a Android.
# Allí los crashes nativos los captura el SDK de Sentry (Gradle); el crate `sentry` (rustls) sigue vivo.
tauri-plugin-sentry = "0.5"
# Una sola instancia (REV-05): un segundo lanzamiento no arranca otro proceso sobre la misma
# `data.db`, sólo trae al frente la ventana del que ya está abierto. Sólo escritorio: en Android
# el sistema ya garantiza una instancia por app.
tauri-plugin-single-instance = "2"

# ───────────── Solo Android ─────────────
[target.'cfg(target_os = "android")'.dependencies]
# Enruta las macros de `log` a logcat (diagnóstico de arranque/JNI en dispositivo).
android_logger = "0.14"
