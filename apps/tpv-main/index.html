<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <!-- Sin ampliar: el iPhone amplía al tocar un campo con letra de menos de 16 px y la pantalla se
             queda movida; en una app de caja tampoco se pellizca para ampliar. `viewport-fit=cover`: en el
             iPhone la página ocupa la pantalla entera y deja ella el hueco de las zonas seguras
             (`.zona-segura` en Global.css, `src-tauri/src/vista_ios.rs`). -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
        <title>TPV Altaria Lights</title>
        <!-- El tema antes del primer pintado (tema-inicial.js). -->
        <script src="/tema-inicial.js"></script>
    </head>

    <body>
        <div id="root"></div>
        <!-- Antes que la app: si no llega a pintar nada, enseña por qué (diagnostico-arranque.js). -->
        <script src="/diagnostico-arranque.js"></script>
        <script type="module" src="/src/app/main.tsx"></script>
    </body>
</html>
