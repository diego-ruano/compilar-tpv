<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/vite.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>TPV Altaria Lights</title>
        <!--
          Anti-FOUC: aplica el tema al <html> ANTES del primer pintado, para
          que al recargar (Ctrl+R) no aparezca un destello blanco antes de que
          React monte y el store useTheme añada la clase. Debe ir en el <head>
          y ser síncrono (sin type="module") para bloquear el render inicial.
        -->
        <script>
            (function () {
                try {
                    var dark =
                        localStorage.getItem("tpv:theme") === "dark";
                    var root = document.documentElement;
                    if (dark) root.classList.add("dark");
                    root.style.backgroundColor = dark ? "#0e0f13" : "#f3f8ff";
                    root.style.colorScheme = dark ? "dark" : "light";
                } catch (e) {
                    /* localStorage no disponible: ignoramos */
                }
            })();
        </script>
    </head>

    <body>
        <div id="root"></div>
        <!-- Antes que la app: si no llega a pintar nada, enseña por qué (diagnostico-arranque.js). -->
        <script src="/diagnostico-arranque.js"></script>
        <script type="module" src="/src/app/main.tsx"></script>
    </body>
</html>
