# Workspace JS/TS del monorepo TPV.
# Las crates Rust se gestionan aparte en el Cargo workspace de la raíz (./Cargo.toml).
packages:
  - "apps/*"
  - "packages/*"

# Versiones que tienen que coincidir en todo el monorepo: un paquete las pide con `catalog:`.
catalog:
  # La misma para la app, el worker y ESLint, que analiza con el TypeScript que encuentre. Sólo
  # parches: typescript-eslint admite hasta la 6.0, así que la 6.1 y la 7 esperan a que lo amplíe.
  typescript: ~6.0.3
