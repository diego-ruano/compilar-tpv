# Configuración de cargo-nextest (runner de los tests de Rust).
#
# Nextest corre cada test en su propio proceso: los que fijan estado global (`static`, `OnceLock`;
# por ejemplo, el bloque `SistemaInformatico` de Veri*factu) no se pisan entre sí, y un aborto
# nativo no se lleva el resultado del resto de la tanda. Con `cargo test` todos comparten proceso.
#
# Los reintentos muestran cualquier fallo transitorio como FLAKY. Para verificar que algo es
# estable se usa --retries 0, de modo que un fallo no quede oculto por otro intento.

# Specta exporta desde el ejecutable Tauri; los tests de contratos ya son pruebas puras.
[profile.default]
retries = 2

# En CI conviene ver cuántos han sido flaky sin que el runner se pare en el primero.
[profile.ci]
retries = 2
fail-fast = false
