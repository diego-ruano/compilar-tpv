# Configuración de cargo-nextest (runner de los tests de Rust).
#
# Nextest corre cada test en su propio proceso: aísla los OnceLock y permite identificar
# cualquier aborto nativo sin perder el resultado del resto de la tanda.
#
# libsql 0.9.30 cerraba dos veces las conexiones locales (#2251), provocando
# STATUS_ACCESS_VIOLATION en Windows. Cargo aplica el cierre idempotente de vendor/libsql;
# las reaperturas deben esperar además a Db::cerrar(). Los reintentos se conservan para
# mostrar cualquier fallo transitorio como FLAKY. Al verificar estas correcciones se usa
# --retries 0, de modo que un fallo no quede oculto por otro intento.

# Specta exporta desde el ejecutable Tauri; los tests de contratos ya son pruebas puras.
[profile.default]
retries = 2

# En CI conviene ver cuántos han sido flaky sin que el runner se pare en el primero.
[profile.ci]
retries = 2
fail-fast = false
