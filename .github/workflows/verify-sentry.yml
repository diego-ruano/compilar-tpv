name: Comprobar Sentry

on:
  workflow_dispatch:
    inputs:
      preview:
        description: Subir una versión de prueba del worker sin activar su despliegue
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Construir y comprobar Sentry con el worker real
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_WORKER_PROJECT: ${{ vars.SENTRY_WORKER_PROJECT }}
        run: |
          node scripts/release/worker.mjs prepare target/worker-release
          node scripts/release/verify-worker-sentry.mjs target/worker-release
      - name: Validar Cloudflare y subir la versión de prueba
        if: inputs.preview
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_WORKER_PROJECT: ${{ vars.SENTRY_WORKER_PROJECT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/release/worker.mjs cloudflare target/worker-release
          pnpm --filter tpv-api exec wrangler versions upload --config ../../target/worker-release/wrangler.json --message "Comprobación de Sentry; no activa el despliegue"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sentry-worker-verification
          path: target/worker-sentry-verification.json
          if-no-files-found: ignore

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Comprobar proyecto, DSN y mapas de escritorio
        env:
          TPV_RELEASE_BUILD: "1"
          TPV_SENTRY_DSN: ${{ secrets.TPV_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          node scripts/release/sentry-config.mjs validate
          pnpm --filter @tpv/main build
          node scripts/release/sentry-config.mjs maps apps/tpv-main/dist
