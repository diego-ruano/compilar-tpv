name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancela ejecuciones anteriores de la misma rama/PR si llega un push nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tests de Rust: dominio (validaciones puras), casos de uso (con repos falsos) y persistencia.
  # El de persistencia incluye además el ANTI-DRIFT: el esquema que producen las migraciones sobre
  # una BD vacía debe coincidir con packages/database/schema.snapshot.sql. Si alguien cambia una
  # migración sin regenerar el snapshot (o introduce una desviación silenciosa), este job falla.
  #
  # Se listan las crates una a una en vez de usar --workspace: el workspace incluye
  # apps/tpv-main/src-tauri, que necesita las librerías de sistema de Tauri (GTK/webkit2gtk) y no
  # compila en un runner Ubuntu pelado.
  migrations-rust:
    name: Tests Rust + anti-drift de migraciones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.91.1
      - uses: Swatinem/rust-cache@v2

      - name: Tests de dominio, casos de uso y persistencia
        run: cargo test -p tpv-domain -p tpv-application -p tpv-infra-sqlite

  # Frontend: typecheck (usa bindings.ts ya commiteado, sin recompilar Rust).
  frontend:
    name: Typecheck + tests del frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Incluye los tests: viven fuera del `include` de la app, así que sin su tsconfig propio
      # sus errores de tipos no los vería nadie.
      - name: Typecheck frontend
        run: pnpm --filter @tpv/main typecheck

      # Lógica del frontend (entorno node, sin DOM): funciones puras y stores. Los componentes NO
      # se prueban aquí — ver el comentario de `apps/tpv-main/vitest.config.ts`.
      - name: Tests del frontend
        run: pnpm --filter @tpv/main test

  # Worker: typecheck, suite de tests (corre dentro de workerd con el pool de Cloudflare) y que el
  # registro manual de migraciones (tenantMigrations.ts) no se desincronice de la carpeta
  # packages/database/migrations/.
  worker:
    name: Worker typecheck + tests + registro de migraciones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Typecheck del worker
        run: pnpm --filter tpv-api typecheck

      # Los bindings remotos están desactivados en vitest.config.ts, así que no hacen falta
      # credenciales de Cloudflare ni el .dev.vars local (que no se commitea).
      - name: Tests del worker
        run: pnpm --filter tpv-api test

      - name: Anti-drift del registro de migraciones del worker
        run: node scripts/check-migration-registry.mjs

      # ARCH-01: qué comandos con doble implementación se han quedado sin test de contrato.
      # AVISA, NO ROMPE: el script sale siempre con 0 y deja anotaciones `::warning::` + una tabla
      # en el resumen del job. `continue-on-error` es el cinturón sobre los tirantes, para que ni
      # un fallo del propio script (un JSON mal formado, por ejemplo) tumbe el push.
      - name: Cobertura del harness de contrato (informativo)
        continue-on-error: true
        run: node scripts/check-contract-coverage.mjs
