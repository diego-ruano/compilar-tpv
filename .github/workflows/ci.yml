name: CI

on:
  push:
    branches: [main]
  pull_request:
  # RI-30: `release.yml` lo llama antes de publicar, para que un tag cuyo commit no pasa no llegue a
  # ningún equipo.
  workflow_call:

permissions:
  contents: read

# Cancela ejecuciones anteriores de la misma rama/PR si llega un push nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  herramientas-release:
    name: Herramientas de release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Instalar el firmante aislado
        run: pnpm --dir .github/tools/updater-signer install --ignore-workspace --frozen-lockfile --ignore-scripts
      - name: Firma válida y rechazo de artefactos manipulados
        run: node --test scripts/release/artifact.test.mjs

  # RI-22: informe independiente. Las herramientas sólo proponen candidatos, y sus propios
  # fallos aparecen como avisos; ni unos ni otros bloquean el resto de la verificación.
  codigo-muerto:
    name: Código muerto (informativo)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@4b9dce445545e3cfd00877041d9dcdf2acd29f36 # 1.93.1
        with:
          toolchain: 1.93.1
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-machete@0.9.2
      - name: Verificar que el informe distingue hallazgos de fallos
        run: node --test scripts/check-dead-code.test.mjs
      - name: Knip y cargo-machete
        continue-on-error: true
        run: pnpm check:dead-code

  # ESLint del monorepo (INFRA-04). Tres reglas de ANÁLISIS, no de estilo: hooks mal colocados,
  # dependencias de efecto incompletas y promesas sin gestionar. El criterio de por qué son tan
  # pocas está en `eslint.config.mjs` y conviene leerlo antes de añadir la cuarta.
  #
  # `--max-warnings` NO se pone a 0 a propósito: `react-hooks/exhaustive-deps` es un aviso porque a
  # veces la dependencia se omite a sabiendas. Lo que rompe el build son los errores.
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

  # Frontend: typecheck (usa bindings.ts ya commiteado, sin recompilar Rust).
  frontend:
    name: Typecheck + tests del frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Incluye los tests: viven fuera del `include` de la app, así que sin su tsconfig propio
      # sus errores de tipos no los vería nadie.
      - name: Typecheck frontend
        run: pnpm --filter @tpv/main typecheck

      # Funciones puras y stores en node; regresiones de componentes en jsdom por fichero.
      - name: Tests del frontend
        run: pnpm --filter @tpv/main test

  # RI-87: exportar usa las firmas reales del ejecutable Tauri, sin arrancar la aplicación.
  contratos-tauri:
    name: Contratos IPC generados al día
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@4b9dce445545e3cfd00877041d9dcdf2acd29f36 # 1.93.1
        with:
          toolchain: 1.93.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-nextest
      # nextest aísla cada test: evita contaminar los OnceLock y limita los crashes de libsql.
      # El perfil CI reintenta y muestra FLAKY, y no corta la tanda al primer fallo.
      - name: Tests de todas las crates (incluidos guardianes y anti-drift)
        run: cargo nextest run --workspace --profile ci --locked
      - name: Clippy de todas las crates (sin avisos)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Comprobar contratos y comandos
        run: node scripts/generate-types.mjs --check

  # Worker: typecheck, suite de tests (corre dentro de workerd con el pool de Cloudflare) y que el
  # registro manual de migraciones (tenantMigrations.ts) no se desincronice de la carpeta
  # packages/database/migrations/.
  worker:
    name: Worker typecheck + tests + registro de migraciones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Typecheck del worker
        run: pnpm --filter tpv-api typecheck

      # Los bindings remotos están desactivados en vitest.config.ts, así que no hacen falta
      # credenciales de Cloudflare ni el .dev.vars local (que no se commitea).
      - name: Tests del worker
        run: pnpm --filter tpv-api test

      - name: Anti-drift del registro de migraciones del worker
        run: node scripts/check-migration-registry.mjs

      # ARCH-01 / CLI-05: qué comandos (escritura) y qué lecturas con doble implementación se han
      # quedado sin test de contrato. Los tests en sí ya corren arriba —los de Rust en el job de
      # `cargo nextest` de contratos-tauri, los del worker en `pnpm --filter tpv-api test`—; esto sólo
      # mide el hueco.
      # AVISA, NO ROMPE: el script sale siempre con 0 y deja anotaciones `::warning::` + una tabla
      # en el resumen del job. `continue-on-error` es el cinturón sobre los tirantes, para que ni
      # un fallo del propio script (un JSON mal formado, por ejemplo) tumbe el push.
      - name: Cobertura de los harness de contrato (informativo)
        continue-on-error: true
        run: node scripts/check-contract-coverage.mjs
