name: Release

# Se dispara al publicar un tag de versión, p. ej.:  git tag v1.0.0 && git push origin v1.0.0
# Flujo: pasa el CI, compila, firma en otro runner el instalador de Windows, lo sube a R2 y lo publica en el feed de
# tpv-api en el canal beta (bares piloto). Se promociona a todos con `pnpm release:promocionar`.
#
# IMPORTANTE: sube la `version` en apps/tpv-main/src-tauri/tauri.conf.json y Cargo.toml ANTES de
# tagear; deben coincidir con el tag (el updater compara esa versión).
#
# Secretos requeridos (Settings → Secrets and variables → Actions → Secrets):
#   TAURI_SIGNING_PRIVATE_KEY            contenido de apps/tpv-main/src-tauri/.tauri/updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   contraseña de esa clave (vacía si no tiene)
#   R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY   token de API de R2 (S3-compatible)
#   R2_ACCOUNT_ID                        id de cuenta Cloudflare (para el endpoint de R2)
#   RELEASE_ADMIN_TOKEN                  el mismo secreto que en el worker (POST /v1/update/publish)
#   TPV_SENTRY_DSN / SENTRY_AUTH_TOKEN    DSN de escritorio y token interno de Sentry
# Variables requeridas (… → Variables):
#   R2_BUCKET                            p. ej. tpv-releases
#   R2_PUBLIC_BASE_URL                   p. ej. https://releases.altarialights.com
#   TPV_API_BASE                         https://tpv-api.altarialights.workers.dev
#   SENTRY_ORG / SENTRY_PROJECT          altaria-lights / tpv-desktop

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-modern
  cancel-in-progress: false

jobs:
  # RI-30: el CI entero antes de publicar. Sin esto, un tag sobre un commit que no pasaba los tests se
  # compilaba y se ofrecía igual.
  ci:
    uses: ./.github/workflows/ci.yml

  # RI-25: compilar, firmar y publicar no comparten runner ni credenciales.
  #
  # AUD-44: ningún job de este workflow restaura ni guarda una caché. La de pnpm la guardan también
  # los jobs de CI, que ejecutan código de terceros sin secretos, y pnpm usa lo que encuentra en su
  # almacén sin revalidarlo contra el lockfile: un Wrangler cambiado ahí correría aquí con los
  # tokens. Cada job instala desde el registro con su lockfile (scripts/release/workflows.test.mjs).
  build:
    needs: ci
    runs-on: windows-latest
    # AUD-44: sin caché de Rust, los contratos y el instalador se compilan desde cero.
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      # AUD-44: sin `cache: pnpm` y sin la caché de Rust: lo que se firma no sale de una caché.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@4b9dce445545e3cfd00877041d9dcdf2acd29f36 # 1.93.1
        with:
          toolchain: 1.93.1
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Validar versiones, token y DSN activo de Sentry
        id: version
        env:
          TPV_RELEASE_BUILD: "1"
          TPV_SENTRY_DSN: ${{ secrets.TPV_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: node scripts/release/sentry-config.mjs validate $env:GITHUB_REF_NAME
      - name: Comprobar contratos IPC
        run: pnpm generate-types:check
      - name: Compilar instalador sin la clave del updater
        env:
          TPV_RELEASE_BUILD: "1"
          TPV_SENTRY_DSN: ${{ secrets.TPV_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ steps.version.outputs.sentry_release }}
        shell: pwsh
        run: |
          $config = Join-Path $env:GITHUB_WORKSPACE '.github/tauri-unsigned.json'
          pnpm --filter @tpv/main tauri build --config $config -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Comprobar mapas subidos y ausencia de mapas en el instalador
        env:
          TPV_SENTRY_DSN: ${{ secrets.TPV_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ steps.version.outputs.sentry_release }}
        run: node scripts/release/sentry-config.mjs maps apps/tpv-main/dist
      - name: Preparar instalador y hash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release/artifact.mjs prepare target/release/bundle/nsis $env:RELEASE_VERSION artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-installer-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      # Sólo la herramienta bloqueada y el verificador: ni dependencias ni scripts de la app.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: tools
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/tools/updater-signer/
            /scripts/release/artifact.mjs
            /apps/tpv-main/src-tauri/tauri.conf.json
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Instalar sólo el firmante (sin scripts ni caché del build)
        run: pnpm --dir tools/.github/tools/updater-signer install --ignore-workspace --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-installer-${{ github.run_attempt }}
          path: artifacts
      - name: Validar el instalador recibido
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: node tools/scripts/release/artifact.mjs verify artifacts $env:RELEASE_VERSION
      - name: Firmar y comprobar con la clave pública del updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "Falta TAURI_SIGNING_PRIVATE_KEY en Secrets de GitHub" }
          $installer = Join-Path $env:GITHUB_WORKSPACE 'artifacts/installer.exe'
          pnpm --dir tools/.github/tools/updater-signer exec tauri signer sign $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/scripts/release/artifact.mjs verify artifacts $env:RELEASE_VERSION tools/apps/tpv-main/src-tauri/tauri.conf.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-installer-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [build, sign, deploy-worker]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/release/artifact.mjs
            /apps/tpv-main/src-tauri/tauri.conf.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-installer-${{ github.run_attempt }}
          path: artifacts
      - name: Verificar firma y hash antes de publicar
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: node scripts/release/artifact.mjs verify artifacts $env:RELEASE_VERSION apps/tpv-main/src-tauri/tauri.conf.json
      - name: Subir instalador a R2
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          if (-not $env:R2_ACCOUNT_ID -or -not $env:R2_BUCKET -or -not $env:AWS_ACCESS_KEY_ID -or -not $env:AWS_SECRET_ACCESS_KEY) {
            throw "Falta configuración de R2 en Secrets/Variables de GitHub"
          }
          $manifest = Get-Content artifacts/manifest.json | ConvertFrom-Json
          $endpoint = "https://$($env:R2_ACCOUNT_ID).r2.cloudflarestorage.com"
          aws s3 cp artifacts/installer.exe "s3://$($env:R2_BUCKET)/$($manifest.name)" --endpoint-url $endpoint --content-type application/octet-stream
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publicar en el feed beta
        shell: pwsh
        env:
          RELEASE_ADMIN_TOKEN: ${{ secrets.RELEASE_ADMIN_TOKEN }}
          TPV_API_BASE: ${{ vars.TPV_API_BASE }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: |
          if (-not $env:RELEASE_ADMIN_TOKEN -or -not $env:TPV_API_BASE -or -not $env:R2_PUBLIC_BASE_URL) {
            throw "Falta configuración del feed en Secrets/Variables de GitHub"
          }
          $manifest = Get-Content artifacts/manifest.json | ConvertFrom-Json
          $url = "$($env:R2_PUBLIC_BASE_URL.TrimEnd('/'))/$($manifest.name)"
          $body = @{
            version = $manifest.version
            url = $url
            signature = (Get-Content -Raw artifacts/installer.exe.sig).Trim()
            notes = "Release v$($manifest.version)"
            channel = "beta"
          } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Uri "$($env:TPV_API_BASE.TrimEnd('/'))/v1/update/publish" -Headers @{ Authorization = "Bearer $env:RELEASE_ADMIN_TOKEN" } -ContentType application/json -Body $body
          Write-Host "Publicado $url en el canal beta"

  build-worker:
    name: Worker · build y mapas en Sentry
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      # AUD-44: sin `cache: pnpm`: lo que se despliega no sale de una caché que escribe CI.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Compilar una vez, inyectar Debug IDs y confirmar el mapa subido
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_WORKER_PROJECT: ${{ vars.SENTRY_WORKER_PROJECT }}
        run: node scripts/release/worker.mjs prepare target/worker-release "$GITHUB_REF_NAME"
      - name: Comprobar recepción y línea TypeScript con el artefacto real
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_WORKER_PROJECT: ${{ vars.SENTRY_WORKER_PROJECT }}
        run: node scripts/release/verify-worker-sentry.mjs target/worker-release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: worker-${{ github.run_attempt }}
          path: target/worker-release/
          if-no-files-found: error
          retention-days: 7

  # AUD-44: quien despliega no instala el workspace ni usa caché. Baja sólo el comprobador
  # (worker.mjs, que no usa paquetes) y Wrangler, a la misma versión que el worker, desde su propio
  # lockfile en .github/tools/worker-deployer, sin scripts de instalación: como el firmante.
  deploy-worker:
    name: Worker · desplegar artefacto verificado
    needs: [build-worker, build, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Sólo el desplegador bloqueado y el comprobador: ni dependencias ni scripts de la app.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/tools/worker-deployer/
            /scripts/release/worker.mjs
            /scripts/release/sentry-config.mjs
            /apps/cloud-worker-licensing/package.json
            /apps/tpv-main/package.json
            /apps/tpv-main/src-tauri/Cargo.toml
            /apps/tpv-main/src-tauri/tauri.conf.json
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Instalar sólo Wrangler (sin scripts ni caché)
        run: pnpm --dir .github/tools/worker-deployer install --ignore-workspace --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: worker-${{ github.run_attempt }}
          path: target/worker-release
      - name: Comprobar identidad, hashes y mapas antes de desplegar
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_WORKER_PROJECT: ${{ vars.SENTRY_WORKER_PROJECT }}
        run: node scripts/release/worker.mjs verify target/worker-release "$GITHUB_REF_NAME"
      # AUD-44: Wrangler sólo recibe las credenciales de Cloudflare; el token de Sentry se queda en
      # el paso anterior, que no ejecuta nada de terceros.
      - name: Comprobar credenciales y desplegar sin recompilar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/release/worker.mjs cloudflare target/worker-release "$GITHUB_REF_NAME"
          pnpm --dir .github/tools/worker-deployer exec wrangler deploy --config "$GITHUB_WORKSPACE/target/worker-release/wrangler.json"
