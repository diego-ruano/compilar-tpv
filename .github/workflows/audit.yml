name: Auditoría de dependencias

# Escaneo de vulnerabilidades conocidas de las dependencias (FABLE-H).
#
# Qué hace: NO actualiza nada. Solo comprueba si alguna dependencia que ya usamos tiene un aviso
# de seguridad publicado (RustSec para Cargo, GitHub Advisory Database para npm). Las
# actualizaciones rutinarias las propone Dependabot (.github/dependabot.yml).
#
# Por qué también semanal y no solo en los PRs: un aviso nuevo aparece sin que nosotros toquemos
# nada. Sin el `schedule`, una dependencia se volvería vulnerable un martes y no nos enteraríamos
# hasta el siguiente PR.
#
# ⚠️ `continue-on-error: true` mientras se ve el ruido real (decisión 2026-08-15). El job sale en
# verde con un aviso ⚠️ en el resumen; cuando confirmemos que no da falsos positivos, se quita esa
# línea y pasa a bloquear de verdad.

on:
  pull_request:
  schedule:
    # Lunes a las 6:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo:
    name: cargo audit (Rust)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4b9dce445545e3cfd00877041d9dcdf2acd29f36 # 1.93.1
        with:
          toolchain: 1.93.1

      # Acción oficial de RustSec: instala y ejecuta cargo-audit sobre el Cargo.lock de la raíz
      # (el único del workspace).
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  npm:
    name: pnpm audit (JS)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # --prod: solo lo que acaba en el binario/worker. Las devDependencies (vite, tsc, wrangler…)
      # no las ejecuta ningún cliente y son la fuente principal de ruido.
      - name: Auditar dependencias de producción
        run: pnpm audit --prod --audit-level moderate
