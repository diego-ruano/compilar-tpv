[package]
name = "tpv-domain"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Núcleo de dominio TPV: entidades puras, value objects y reglas de negocio. No conoce DB, red ni Tauri."

[dependencies]
serde = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
# Cripto de PIN (PBKDF2-HMAC-SHA256) para el dominio de login: cómputo puro, sin I/O.
pbkdf2 = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
# Sólo para que `Dinero` (ARQ-01) cruce la frontera a TypeScript. El dominio sigue sin saber de DB,
# red ni Tauri: ts-rs es una macro de derivación que genera el tipo, no una dependencia de runtime.
ts-rs = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
