[package]
name = "tpv-infra-sqlite"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Adaptador de persistencia TPV: implementa los puertos de repositorio de tpv-application contra SQLite local (rusqlite)."

[dependencies]
tpv-domain = { workspace = true }
tpv-application = { workspace = true }
tpv-contracts = { workspace = true }
rusqlite = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
async-trait = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
# Migraciones: embeber packages/database/migrations + hash de integridad.
include_dir = { workspace = true }
sha2 = { workspace = true }
# Las copias locales se guardan comprimidas (ver recovery.rs).
flate2 = { workspace = true }
# Fachada de logging: los fallos de aplicación de sync se registran en local (el SQL sólo a `debug`).
tracing = { workspace = true }
