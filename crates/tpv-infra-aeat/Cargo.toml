[package]
name = "tpv-infra-aeat"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Adaptador de remisión a la AEAT (Veri*factu): SOAP, XML y TLS mutuo con el certificado del almacén de Windows."

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

tpv-application = { workspace = true }
tpv-domain = { workspace = true }

# ── Sólo Windows ───────────────────────────────────────────────────────────────────────────────
# El transporte usa WinHTTP (que por dentro es schannel, la pila TLS del sistema) y el almacén de
# certificados por CryptoAPI. Ver la nota de `transporte.rs`: es lo que permite usar un certificado
# cuya clave privada NUNCA sale del almacén, sea de un KSP moderno (CNG), de un CSP heredado o de
# una tarjeta.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }
