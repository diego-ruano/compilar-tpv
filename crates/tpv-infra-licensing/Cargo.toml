[package]
name = "tpv-infra-licensing"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Adaptador de licenciamiento e identidad de dispositivo TPV: cripto ed25519, almacén de claves (keyring) y llamadas HTTP al worker de licencias. Implementa los puertos definidos en tpv-application."

[dependencies]
tpv-domain = { workspace = true }
tpv-application = { workspace = true }
tpv-contracts = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
aes-gcm = { workspace = true }
hmac = { workspace = true }
rand = { workspace = true }
# Fachada de logging (diagnostico de secret_store en Android -> logcat via android_logger de la app).
log = "0.4"

# keyring (keychain del SO) solo en escritorio; en Android su backend seria mock (no persistente),
# asi que alli se sustituye por el almacen JNI Android Keystore + SharedPreferences (secret_store.rs).
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { workspace = true }

# Android: clases del framework (jni) para el almacen de secretos cifrado con Android Keystore. La
# JavaVM la entrega JNI_OnLoad del cdylib de la app y el Context sale de ActivityThread. Ver secret_store.rs.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
