[package]
name = "tpv-infra-licensing"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Adaptador de licenciamiento e identidad de dispositivo TPV: cripto ed25519, almacén de claves (keyring) y llamadas HTTP al worker de licencias. Implementa los puertos definidos en tpv-application."

[dependencies]
tpv-domain = { workspace = true }
tpv-application = { workspace = true }
tpv-contracts = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
aes-gcm = { workspace = true }
hmac = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# El servidor local de los tests del transporte (`tests_transporte_de_volcados`) y el gzip con el que
# contesta. Sólo se compilan al testear.
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "time"] }
flate2 = { workspace = true }

# keyring (almacén del SO) sólo en escritorio: en Android no tiene almacén propio, así que allí se
# sustituye por el almacén JNI Android Keystore + SharedPreferences (secret_store.rs).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { workspace = true }

# iOS: keyring 4 no trae almacén por defecto para iOS (su `v1` devuelve error en esa plataforma), así
# que se usa directamente el «protected data» de Apple, el llavero de la propia app (secret_store.rs).
[target.'cfg(target_os = "ios")'.dependencies]
keyring-core = "1"
apple-native-keyring-store = { version = "1", features = ["protected"] }

# Android: clases del framework (jni) para el almacen de secretos cifrado con Android Keystore. La
# JavaVM la entrega JNI_OnLoad del cdylib de la app y el Context, MainActivity. Ver secret_store.rs.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
