[package]
name = "tpv-infra-licensing"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Adaptador de licenciamiento e identidad de dispositivo TPV: cripto ed25519, almacén de claves (keyring) y llamadas HTTP al worker de licencias. Implementa los puertos definidos en tpv-application."

[dependencies]
tpv-domain = { workspace = true }
tpv-application = { workspace = true }
tpv-contracts = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }

# keyring (keychain del SO) solo en escritorio; en Android su backend seria mock (no persistente),
# asi que alli se sustituye por el almacen JNI Android Keystore + SharedPreferences (secret_store.rs).
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { workspace = true }

# Android: acceso al Context/JavaVM (ndk-context) y a las clases del framework (jni) para el almacen
# de secretos cifrado con Android Keystore. Ver secret_store.rs.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
